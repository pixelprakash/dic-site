    <!-- Licensed typefaces (see the note at the end of src/styles/redesign-c.css).
         Put the files in public/fonts/season/ and remove the comment markers:
    <style>
      @font-face { font-family: 'Season Mix'; font-weight: 100 420; font-display: swap;
        src: url(/fonts/season/SeasonMix-Regular.woff2) format('woff2'); }

    <script>
      (function () {
        var d = 'a';
        try {
          var q = new URLSearchParams(location.search).get('design');
          d = /^[abc]$/.test(q) ? q : localStorage.getItem('dic-design') || 'a';
        } catch (e) {}
        var display = { a: 'archivo-latin', b: 'zilla-slab-latin-600', c: 'fraunces-latin' }[d] || 'archivo-latin';
        ['dm-sans-latin', display].forEach(function (f) {
          var l = document.createElement('link');
          l.rel = 'preload'; l.as = 'font'; l.type = 'font/woff2'; l.crossOrigin = 'anonymous';
          l.href = '/fonts/' + f + '.woff2';
          document.head.appendChild(l);
        });
        // Design 3's home page opens on a photograph: start fetching it now.
        if (d === 'c' && location.pathname === '/') {
          var p = document.createElement('link');
          p.rel = 'preload'; p.as = 'image'; p.href = '/images/image7-1000.webp';
          p.setAttribute('fetchpriority', 'high');
          p.setAttribute('imagesrcset', '/images/image7-600.webp 600w, /images/image7-1000.webp 1000w, /images/image7.webp 1600w');
          p.setAttribute('imagesizes', '100vw');
          document.head.appendChild(p);
        }
      })();
    </script>
